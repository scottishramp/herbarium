name: Temporary - built-in token cannot merge workflow edits
on: workflow_dispatch
permissions:
  contents: write
  pull-requests: write
jobs:
  try-merge-pr-2:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/2/merge" -f merge_method=squash
